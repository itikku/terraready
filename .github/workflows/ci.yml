name: Backend checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Formatting, lint, types and behavioral tests
        run: make check
      - name: Verify repeatable local seeding
        run: |
          make seed
          make seed
      - name: Verify live HTTP decisions
        run: |
          .venv/bin/uvicorn terraready.main:app --host 127.0.0.1 --port 8000 &
          terraready_api_pid=$!
          trap 'kill "$terraready_api_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then break; fi
            sleep 0.5
          done
          make smoke
      - name: Build source and wheel distributions
        run: uv build
