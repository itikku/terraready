name: TerraReady checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Formatting, lint, types and behavioral tests
        run: make check
      - name: Verify repeatable local seeding
        run: |
          make seed
          make seed
      - name: Verify live HTTP decisions
        run: |
          .venv/bin/uvicorn terraready.main:app --host 127.0.0.1 --port 8000 &
          terraready_api_pid=$!
          trap 'kill "$terraready_api_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then break; fi
            sleep 0.5
          done
          make smoke
      - name: Build source and wheel distributions
        run: uv build

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --frozen --extra dev
          npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .data/pw-browsers
      - name: Frontend types, lint, formatting and production build
        run: make web-check
      - name: Shared budget policy and local Cloudflare persistence
        run: make controller-check
      - name: Interaction, accessibility and visual regression checks
        run: make browser-check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
