[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "terraready"
version = "0.1.0"
description = "Local, evidence-backed ground-readiness planning prototype"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "lancedb>=0.25,<1",
  "pydantic>=2.10,<3",
  "pyarrow>=20,<27",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
terraready-seed = "terraready.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/terraready"]

[tool.hatch.build.targets.sdist]
include = ["apps/api/src", "config", "data/fixtures", "tests/api", "scripts", "docs", "README.md", "LICENSE", "Makefile", "uv.lock"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src/terraready"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/api"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["terraready"]

[tool.coverage.report]
show_missing = true
fail_under = 90
